<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> — Contact Form</title>
<style>
  :root{
    --navy:#0d2044;
    --navy-2:#16305e;
    --gold:#c9972f;
    --paper:#faf6ec;
    --line:#d8cfb4;
    --red:#b3261e;
    --green:#1e7a3d;
    --ink:#1c1c1c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: repeating-linear-gradient(135deg, #eee7d3, #eee7d3 12px, #e8e0c8 12px, #e8e0c8 24px);
    padding:20px 12px 60px;
    color:var(--ink);
  }
  .card{
    max-width:520px;
    margin:0 auto;
    background:var(--paper);
    border:2px solid var(--navy);
    outline:1px dashed var(--gold);
    outline-offset:-8px;
    position:relative;
  }
  .header{
    background:linear-gradient(90deg,var(--navy),var(--navy-2));
    color:#fff;
    padding:18px 20px 16px;
    text-align:center;
    border-bottom:4px solid var(--gold);
  }
  .header .brand{
    font-size:13px;
    letter-spacing:1px;
    opacity:.8;
    margin-bottom:4px;
  }
  .header h1{
    margin:0;
    font-size:20px;
    line-height:1.3;
  }
  .header p{
    margin:8px 0 0;
    font-size:13px;
    opacity:.85;
  }
  .body{ padding:20px 20px 8px; }
  .field{ margin-bottom:16px; }
  label{
    display:block;
    font-size:13.5px;
    font-weight:600;
    margin-bottom:5px;
    color:var(--navy);
  }
  label .req{ color:var(--red); }
  label .hint{
    display:block;
    font-weight:400;
    font-size:11.5px;
    color:#666;
    margin-top:1px;
  }
  input[type=text], input[type=tel], input[type=date], textarea{
    width:100%;
    padding:10px 11px;
    border:1px solid var(--line);
    border-radius:4px;
    font-size:14px;
    background:#fff;
    font-family:inherit;
  }
  input:focus, textarea:focus{
    outline:2px solid var(--gold);
    border-color:var(--gold);
  }
  textarea{ min-height:70px; resize:vertical; }
  .check-grid{
    display:flex; flex-direction:column; gap:8px;
    border:1px solid var(--line);
    border-radius:4px;
    padding:10px 12px;
    background:#fff;
  }
  .check-row{ display:flex; align-items:center; gap:8px; font-size:14px; }
  .check-row input{ width:16px; height:16px; }
  .radio-row{ display:flex; gap:16px; flex-wrap:wrap; }
  .radio-opt{ display:flex; align-items:center; gap:6px; font-size:14px; }
  .loc-link{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    width:100%;
    font-size:14px;
    font-weight:600;
    color:#fff;
    background:var(--navy-2);
    border:1px solid var(--gold);
    border-radius:5px;
    padding:11px 10px;
    margin-top:8px;
    cursor:pointer;
  }
  .loc-link:hover{ background:var(--navy); }
  .loc-link:disabled{ opacity:.6; cursor:not-allowed; }
  .loc-status{
    font-size:11.5px;
    margin-top:5px;
    display:none;
  }
  .loc-status.show{ display:block; }
  .loc-status.ok{ color:var(--green); }
  .loc-status.err{ color:var(--red); }
  .loc-status.loading{ color:#8a6d00; }
  #subjectWrap, #comboWrap{ margin-top:10px; }
  .submit-btn{
    width:100%;
    padding:14px;
    background:var(--green);
    color:#fff;
    font-size:15.5px;
    font-weight:700;
    border:none;
    border-radius:5px;
    cursor:pointer;
    margin:6px 0 4px;
  }
  .submit-btn:active{ transform:scale(.99); }
  .submit-btn:disabled{ background:#9bb8a4; cursor:not-allowed; }
  .footnote{
    text-align:center;
    font-size:11px;
    color:#8a8368;
    padding:6px 20px 18px;
  }
  .error-msg{
    color:var(--red);
    font-size:12px;
    margin-top:4px;
    display:none;
  }
  .save-status{
    text-align:center;
    font-size:12px;
    padding:0 20px 10px;
    display:none;
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="brand"></div>
    <h1>📋 Plz once time verify </h1>
    <p>Form  fill kar ke — WhatsApp par send</p>
  </div>

  <div class="body">
    <form id="leadForm" novalidate>

      <div class="field">
        <label>Aapka Naam <span class="req">*</span></label>
        <input type="text" id="name" required placeholder="Poora naam likhein">
      </div>

      <div class="field">
        <label>WhatsApp Number <span class="req">*</span>
          <span class="hint">10-digit number</span>
        </label>
        <input type="tel" id="whatsapp" required maxlength="10" placeholder="9876543210">
        <div class="error-msg" id="whatsappErr">Sahi 10-digit number daalein</div>
      </div>

      <div class="field">
        <label>Aapka PhonePe Number
          <span class="hint">Verify ke liye — future me delete hone par notes dobara isi number se milega</span>
        </label>
        <input type="tel" id="phonepe" maxlength="10" placeholder="9876543210">
      </div>

       <div class="field">
        <label>App ne jis Upi app se payment kiya tha use aapka name hai 
          <span class="hint">Verify ke liye — future me delete hone par notes dobara isi name se Verify kiya jayega </span>
        </label>
        <input type="tel" id="phonepe" maxlength="10" placeholder="Rajluck yadav     (ye upi name  tha mere )">
      </div>

      <div class="field">
        <label>Coaching Ka Naam <span class="req">*</span>
          <span class="hint"></span>
        </label>
        <input type="text" id="coachingName" required>
      </div>

      <div class="field">
        <label>Coaching Address / Area <span class="req">*</span>
          <span class="hint">City, area, nearby landmark</span>
        </label>
        <input type="text" id="address" required>
      </div>

      <div class="field">
        <label>Famous Nearby — Shop / Jagah / City
          <span class="hint">e.g. SBI Bank ke saamne — location dhundhne mein help karta hai</span>
        </label>
        <input type="text" id="landmark">
      </div>

      <div class="field">
        <label>District</label>
        <input type="text" id="district"  placeholder="gaya ji ">
        
      </div>

      <div class="field">
        <label>Pincode</label>
        <input type="text" id="pincode" maxlength="6">
      </div>

      <div class="field">
        <button type="button" class="loc-link" id="locBtn">📍 Live Location Se Sab Auto-fill Karein (Address, Landmark, District, Pincode)</button>
        <div class="loc-status" id="locStatus"></div>
      </div>

      <div class="field">
        <label>Kis Date Ko Purchase Kiya Tha?
          <span class="hint">Yaad ho to bharein</span>
        </label>
        <input type="date" id="purchaseDate">
      </div>

     

      <div class="field">
        <label>Kitna Mein Purchase Kiya Tha?
          <span class="hint">₹ Rupees mein</span>
        </label>
        <input type="text" id="amountPaid" placeholder="e.g. ****rupeee">
      </div>

      <div class="field">
        <label>Konsi Classes Aapne Purchase Kiya Tha? <span class="req">*</span></label>
        <div class="check-grid" id="classGrid">
          <label class="check-row"><input type="checkbox" name="classes" value="Class 9th"> Class 9th</label>
          <label class="check-row"><input type="checkbox" name="classes" value="Class 10th"> Class 10th</label>
          <label class="check-row"><input type="checkbox" name="classes" value="Class 11th"> Class 11th</label>
          <label class="check-row"><input type="checkbox" name="classes" value="Class 12th Science"> Class 12th Science</label>
          <label class="check-row"><input type="checkbox" name="classes" value="Class 12th Arts"> Class 12th Arts</label>
        </div>
        <div class="error-msg" id="classesErr">Kam se kam ek class select karein</div>
      </div>

      <div class="field">
        <label>Purchase Type</label>
        <div class="radio-row">
          <label class="radio-opt"><input type="radio" name="purchaseType" value="All Combo" checked> All Combo</label>
          <label class="radio-opt"><input type="radio" name="purchaseType" value="Single/Double Subject"> Single/Double Subject</label>
        </div>
        <div id="subjectWrap" style="display:none;">
          <input type="text" id="subjectName" placeholder="Subject ka naam likhein">
        </div>
      </div>

      <div class="field">
        <label>Aap Kis Subject Ke Teacher Hain?
          <span class="hint">Optional</span>
        </label>
        <input type="text" id="teacherSubject">
      </div>

      <div class="field">
        <label>Aapka Message / Query</label>
        <textarea id="message" placeholder="Koi sawaal ho to yahan likhein"></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">WhatsApp Pe Send Karo</button>
    </form>
    <div class="save-status" id="saveStatus"></div>
  </div>
  <div class="footnote"> · Aapki details sirf verification ke liye use hoti hain</div>
</div>

<script>
// ===== CONFIG =====
// Apne Google Apps Script Web App URL yahan paste karein (deploy instructions neeche diye hain)
const GOOGLE_SCRIPT_URL = "PASTE_YOUR_APPS_SCRIPT_URL_HERE";
const WHATSAPP_NUMBER = "916200327781"; // 91 + 6200327781

// ===== AUTO-FILL LOCATION (live) =====
const locBtn = document.getElementById('locBtn');
const locStatus = document.getElementById('locStatus');

function runAutoFillLocation(isAuto) {
  if (!navigator.geolocation) {
    if (!isAuto) showLocStatus('Geolocation is supported nahi hai is browser me', 'err');
    return;
  }
  locBtn.disabled = true;
  showLocStatus('Live location dhoondh rahe hain...', 'loading');
  navigator.geolocation.getCurrentPosition(async (pos) => {
    const { latitude, longitude } = pos.coords;
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&addressdetails=1`);
      const data = await res.json();
      if (data && data.display_name) {
        const a = data.address || {};
        document.getElementById('address').value = data.display_name;
        const nearby = a.neighbourhood || a.suburb || a.village || a.town || a.road || '';
        if (nearby) document.getElementById('landmark').value = nearby;
        const district = a.state_district || a.county || a.city_district || a.city || '';
        if (district) document.getElementById('district').value = district;
        const pincode = a.postcode || '';
        if (pincode) document.getElementById('pincode').value = pincode;
        showLocStatus('✓ Address, landmark, district, pincode auto-fill ho gaya', 'ok');
      } else {
        showLocStatus('Address nahi mila, manually likhein', 'err');
      }
    } catch (e) {
      showLocStatus('Kuch galat ho gaya, manually likhein', 'err');
    } finally {
      locBtn.disabled = false;
    }
  }, () => {
    showLocStatus(isAuto ? 'Location permission nahi di — button dabakar dobara try karein' : 'Location permission nahi mili', 'err');
    locBtn.disabled = false;
  });
}

locBtn.addEventListener('click', () => runAutoFillLocation(false));
// Page load hote hi automatically live location try karta hai (browser permission popup aayega)
window.addEventListener('load', () => runAutoFillLocation(true));

function showLocStatus(text, cls) {
  locStatus.textContent = text;
  locStatus.className = `loc-status show ${cls}`;
}

// ===== PURCHASE TYPE TOGGLE =====
const subjectWrap = document.getElementById('subjectWrap');

function applyPurchaseType(value) {
  subjectWrap.style.display = value === 'Single/Double Subject' ? 'block' : 'none';
}

document.querySelectorAll('input[name=purchaseType]').forEach(r => {
  r.addEventListener('change', () => { if (r.checked) applyPurchaseType(r.value); });
});
applyPurchaseType(document.querySelector('input[name=purchaseType]:checked').value);

// ===== FORM SUBMIT =====
const form = document.getElementById('leadForm');
const submitBtn = document.getElementById('submitBtn');
const saveStatus = document.getElementById('saveStatus');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const name = document.getElementById('name').value.trim();
  const whatsapp = document.getElementById('whatsapp').value.trim();
  const phonepe = document.getElementById('phonepe').value.trim();
  const coachingName = document.getElementById('coachingName').value.trim();
  const address = document.getElementById('address').value.trim();
  const landmark = document.getElementById('landmark').value.trim();
  const district = document.getElementById('district').value.trim();
  const pincode = document.getElementById('pincode').value.trim();
  const purchaseDate = document.getElementById('purchaseDate').value;
  const purchaseNumber = document.getElementById('purchaseNumber').value.trim();
  const amountPaid = document.getElementById('amountPaid').value.trim();
  const classes = Array.from(document.querySelectorAll('input[name=classes]:checked')).map(c => c.value);
  const purchaseType = document.querySelector('input[name=purchaseType]:checked').value;
  const subjectName = document.getElementById('subjectName').value.trim();
  const teacherSubject = document.getElementById('teacherSubject').value.trim();
  const message = document.getElementById('message').value.trim();

  let valid = true;
  document.getElementById('whatsappErr').style.display = 'none';
  document.getElementById('classesErr').style.display = 'none';

  if (!/^\d{10}$/.test(whatsapp)) {
    document.getElementById('whatsappErr').style.display = 'block';
    valid = false;
  }
  if (classes.length === 0) {
    document.getElementById('classesErr').style.display = 'block';
    valid = false;
  }
  if (!name || !coachingName || !address) valid = false;
  if (!valid) return;

  submitBtn.disabled = true;
  submitBtn.textContent = 'Bhej rahe hain...';

  const payload = {
    timestamp: new Date().toISOString(),
    name, whatsapp, phonepe, coachingName, address, landmark, district, pincode,
    purchaseDate, purchaseNumber, amountPaid,
    classes: classes.join(', '),
    purchaseType,
    subjectName,
    teacherSubject,
    message
  };

  // Save to Google Sheet (best-effort, non-blocking for WhatsApp send)
  if (GOOGLE_SCRIPT_URL && GOOGLE_SCRIPT_URL !== "PASTE_YOUR_APPS_SCRIPT_URL_HERE") {
    try {
      await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    } catch (err) {
      // Sheet save fail ho bhi jaye to WhatsApp send hona chahiye
    }
  }

  const waText = [
    '📋 *Naya Contact — *',
    `Naam: ${name}`,
    `WhatsApp: ${whatsapp}`,
    phonepe ? `PhonePe No: ${phonepe}` : null,
    `Coaching/School: ${coachingName}`,
    `Address: ${address}`,
    landmark ? `Nearby: ${landmark}` : null,
    district ? `District: ${district}` : null,
    pincode ? `Pincode: ${pincode}` : null,
    purchaseDate ? `Purchase Date: ${purchaseDate}` : null,
    purchaseNumber ? `Purchase Number: ${purchaseNumber}` : null,
    amountPaid ? `Amount Paid: ₹${amountPaid}` : null,
    `Classes: ${classes.join(', ')}`,
    `Purchase Type: ${purchaseType}${purchaseType === 'Single/Double Subject' && subjectName ? ' (' + subjectName + ')' : ''}`,
    teacherSubject ? `Teacher Subject: ${teacherSubject}` : null,
    message ? `Message: ${message}` : null
  ].filter(Boolean).join('\n');

  const waUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(waText)}`;
  window.location.href = waUrl;

  submitBtn.disabled = false;
  submitBtn.textContent = 'WhatsApp Pe Send Karo';
});
</script>

</body>
</html>
